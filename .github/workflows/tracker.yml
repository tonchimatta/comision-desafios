name: Tracker diario

on:
  schedule:
    # 18:00 en Santiago: 21:00 UTC en horario de verano (UTC-3) y 22:00 UTC en invierno (UTC-4).
    # Corre en ambas; el script se ejecuta solo una vez por día, desde las 18:00 locales.
    - cron: "0 21 * * *"
    - cron: "0 22 * * *"
  workflow_dispatch:
    inputs:
      sesion:
        description: "ID de una sesión puntual (opcional)"
        required: false
      backfill:
        description: "Cargar historial desde la legislatura que empieza este año (ej: 2022). No envía correos."
        required: false
      sin_correo:
        description: "No enviar correo"
        type: boolean
        default: false
      forzar:
        description: "Reprocesar aunque ya esté resumida"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: tracker
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - run: pip install -r requirements.txt

      - name: Cookies de YouTube (opcional)
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: |
          if [ -n "$YT_COOKIES" ]; then printf '%s' "$YT_COOKIES" > "$RUNNER_TEMP/cookies.txt"; fi

      - name: Correr tracker
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          YT_COOKIES_FILE: ${{ runner.temp }}/cookies.txt
          SESION: ${{ inputs.sesion }}
          BACKFILL: ${{ inputs.backfill }}
          SIN_CORREO: ${{ inputs.sin_correo }}
          FORZAR: ${{ inputs.forzar }}
        run: |
          args=()
          [ -n "$SESION" ] && args+=(--sesion "$SESION")
          [ -n "$BACKFILL" ] && args+=(--backfill "$BACKFILL")
          [ "$SIN_CORREO" = "true" ] && args+=(--sin-correo)
          [ "$FORZAR" = "true" ] && args+=(--forzar)
          python -m tracker.run "${args[@]}"

      - name: Guardar datos
        if: always()
        run: |
          git config user.name "comision-desafios-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Datos: $(date -u +%Y-%m-%d)"
            git push
          fi
